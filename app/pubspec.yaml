name: college_bus_tracker
description: A new Flutter project for tracking college buses.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
